{% extends "base.html" %}
{% block title %}{{ page_title }} - {{ app_name }}{% endblock %}

{% block content %}
  <h1 class="h3 mb-3">{{ page_title }}</h1>
  <div class="card app-card">
    <div class="card-body text-center py-5">
      <i class="bi bi-{{ icon }} display-5 text-brand"></i>
      <p class="mt-3 mb-0 text-muted">{{ blurb }}</p>
    </div>
  </div>
{% endblock %}

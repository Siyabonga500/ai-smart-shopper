name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff, black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: black --check .

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: pytest
        run: pytest
      - name: Migrations apply to an empty database and match the models
        env:
          APP_ENV: development
          DEV_DATABASE_URL: sqlite:///ci.db
          SECRET_KEY: ci-only-secret
        run: |
          flask --app run db upgrade
          flask --app run db check

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build --tag ai-smart-shopper:ci .
      - name: The image starts and answers /health
        run: |
          docker run -d --name shopper -p 8000:8000 \
            -e APP_ENV=production -e SECRET_KEY=ci-only-secret -e FORCE_HTTPS=0 \
            -e DATABASE_URL=sqlite:////tmp/ci.db ai-smart-shopper:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/health && exit 0; sleep 2; done
          docker logs shopper
          exit 1

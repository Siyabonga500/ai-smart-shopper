[tool.black]
line-length = 120
target-version = ["py311"]
extend-exclude = "migrations/versions"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",   # line length is black's job; long strings and URLs are left alone
    "E701",   # "if x: return" one-liners are used in a few small helpers
    "E731",
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
